  <rect width="108" height="108" rx="24" fill="url(#vb-bg)"/>
  <path d="M37.03,70.97 A24,24 0 1,1 70.97,70.97" fill="none" stroke="#23232E" stroke-width="5" stroke-linecap="round"/>
