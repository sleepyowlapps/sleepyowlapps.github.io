  <path d="M37.03,70.97 A24,24 0 1,1 75.75,43.86" fill="none" stroke="url(#vb-arc)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="54" cy="54" r="16" fill="url(#vb-cap)" stroke="#34343F" stroke-width="1"/>
  <path d="M59.44,51.46 L65.78,48.51" stroke="#FF2BD6" stroke-width="3" stroke-linecap="round"/>
