<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Volume Box icon">
  <!-- Same artwork as the app's adaptive launcher icon
       (android/app/src/main/res/drawable/ic_launcher_foreground.xml). -->
  <defs>
    <radialGradient id="vb-bg" cx="54" cy="50" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15151C"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="vb-arc" x1="37" y1="71" x2="76" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF"/>
